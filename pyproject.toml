[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryspike"
version = "0.2.0"
description = "Detect silent crypto miners by monitoring GPU power spikes during user idle time."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Dharavath Satvik" }
]
dependencies = [
    "nvidia-ml-py>=12.535.133",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
cryspike = "cryspike.cli:main"

[tool.pytest.ini_options]
testpaths = ["cryspike/tests"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
