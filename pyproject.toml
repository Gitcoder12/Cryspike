[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryspike"
version = "0.4.0"
description = "Heuristic detection of suspicious NVIDIA GPU activity during low-CPU periods."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Dharavath Satvik" }
]
dependencies = [
    "nvidia-ml-py>=12.535.133",
    "psutil>=5.9.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
]

[project.scripts]
cryspike = "cryspike.cli:main"

[tool.pytest.ini_options]
testpaths = ["cryspike/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
