[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryspike"
version = "0.1.0"
description = "Detects suspicious GPU activity potentially associated with unauthorized cryptocurrency mining."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Dharavath Satvik" }
]
dependencies = [
    # NVIDIA Management Library (NVML) Python bindings for querying GPU state
    "nvidia-ml-py>=12.535.133",
    # System and process utilities (for checking host idle state, CPU, memory)
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Type checking
    "mypy>=1.0.0",
    # Linting and formatting
    "ruff>=0.1.0",
]

[project.scripts]
# This allows you to run the tool from the terminal as `cryspike`
cryspike = "cryspike.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
